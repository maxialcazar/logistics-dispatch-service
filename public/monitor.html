<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LDE Real-Time Monitor v2</title>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Courier New', monospace; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 20px; margin-bottom: 20px; }
        .stats { font-size: 1.2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card { 
            background: #1e293b; 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid #334155;
            transition: all 0.2s;
        }
        .card.active {
            background: #064e3b; 
            border-color: #10b981;
            transform: scale(1.05);
        }
        .driver-name { font-weight: bold; color: #38bdf8; margin-bottom: 5px; }
        .driver-meta { font-size: 0.8rem; color: #94a3b8; }
        .latlng { font-size: 0.9rem; margin-top: 5px; color: #facc15; }
        #connection-status { padding: 5px 10px; border-radius: 4px; background: #dc2626; color: white; font-weight: bold; }
        #connection-status.connected { background: #16a34a; }
        
        button { background: #2563eb; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 1rem; border-radius: 4px; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #475569; cursor: not-allowed; }

        #logs { 
            background: #000; color: #0f0; padding: 10px; height: 150px; overflow-y: scroll; 
            border: 1px solid #333; margin-top: 20px; font-size: 0.8rem; font-family: monospace;
        }
        .log-line { border-bottom: 1px solid #111; padding: 2px 0; }
        .log-error { color: #ef4444; }
        .log-success { color: #22c55e; }
    </style>
    <!-- Fallback to CDN for reliability -->
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
</head>
<body>

    <div class="header">
        <div>
            <h1>📡 Dispatch Monitor (Empresa A)</h1>
            <div id="connection-status">DISCONNECTED</div>
        </div>
        <div>
            <div class="stats">Update Rate: <span id="rps">0</span> ops/sec</div>
            <div class="stats">Active Drivers: <span id="driver-count">0</span></div>
        </div>
        <button id="btn-connect" onclick="startAutoConnect()">🔌 Connect (Auto-Retry)</button>
    </div>

    <div id="logs"></div>

    <div id="grid" class="grid"></div>

    <script>
        let socket;
        let updateCount = 0;
        let activeDrivers = new Set();
        let retryInterval = null;

        // Logging function
        function log(msg, type = 'info') {
            const el = document.getElementById('logs');
            const line = document.createElement('div');
            line.className = 'log-line ' + (type === 'error' ? 'log-error' : (type === 'success' ? 'log-success' : ''));
            line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            el.appendChild(line);
            el.scrollTop = el.scrollHeight;
            console.log(msg);
        }

        // Init Check
        window.onload = function() {
            log("System Initialized. Ready to connect.");
            if (typeof io === 'undefined') {
                log("CRITICAL ERROR: Socket.IO library failed to load!", 'error');
                alert("Socket.IO library failed to load! Check internet connection.");
            }
        };
        
        // Auto-calculate RPS
        setInterval(() => {
            const rpsEl = document.getElementById('rps');
            if(rpsEl) rpsEl.innerText = updateCount;
            updateCount = 0;
        }, 1000);

        function startAutoConnect() {
            const btn = document.getElementById('btn-connect');
            if(!btn) return;
            btn.innerText = "Searching for Server...";
            btn.disabled = true;
            
            log("Starting Auto-Connect sequence...");

            // Initial try
            connect();

            // Retry loop
            if (!retryInterval) {
                retryInterval = setInterval(connect, 3000);
            }
        }

        async function connect() {
            try {
                // 1. Authenticate
                // Note: User 'adminA' / '123456' is created by load-test script
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: "adminA", password: "123456" })
                });
                
                if (!res.ok) {
                    // 401 Unauthorized or 404 Not Found (User not created yet)
                    // We don't log this heavily to avoid spamming while waiting for script
                    if (updateCount === 0) { // Only log occasionally? No, let's keep it simple
                         console.log("Login waiting... (Is script running?)");
                    }
                    return; 
                }

                const data = await res.json();
                const token = data.token;
                log("✅ Login Success! Access Token received via API.", 'success');

                // Stop retrying
                if (retryInterval) {
                    clearInterval(retryInterval);
                    retryInterval = null;
                }

                // 2. Connect Socket
                log("Connecting WebSocket to default namespace...");
                
                // Transports: Try both for max compatibility
                socket = io('/', {
                    auth: { token: token },
                    transports: ['websocket', 'polling'] 
                });

                socket.on('connect', () => {
                    log("✅ WEBSOCKET CONNECTED! Listening for events...", 'success');
                    document.getElementById('connection-status').innerText = "CONNECTED";
                    document.getElementById('connection-status').classList.add('connected');
                    document.getElementById('btn-connect').style.display = 'none';
                });

                socket.on('disconnect', () => {
                    log("⚠️ WebSocket Disconnected", 'error');
                    document.getElementById('connection-status').innerText = "DISCONNECTED";
                    document.getElementById('connection-status').classList.remove('connected');
                });
                
                socket.on('connect_error', (err) => {
                    log("❌ Socket Connection Error: " + err.message, 'error');
                });

                // 3. Listen for Updates
                socket.on('driver-location-updated', (payload) => {
                    updateCount++;
                    updateCard(payload);
                });

            } catch (err) {
                log("❌ Network Error: " + err.message, 'error');
            }
        }

        function updateCard(data) {
            const grid = document.getElementById('grid');
            let card = document.getElementById(`driver-${data.driverId}`);
            
            if (!activeDrivers.has(data.driverId)) {
                activeDrivers.add(data.driverId);
                const dc = document.getElementById('driver-count');
                if(dc) dc.innerText = activeDrivers.size;
            }

            // Create if new
            if (!card) {
                card = document.createElement('div');
                card.id = `driver-${data.driverId}`;
                card.className = 'card';
                card.innerHTML = `
                    <div class="driver-name">${data.driverId.split('-')[0]}...</div>
                    <div class="driver-meta">ID: ${data.driverId.substring(0,8)}</div>
                    <div class="latlng" id="ll-${data.driverId}">waiting...</div>
                    <div class="driver-meta" style="margin-top:5px; font-size:0.7em">LAG: <span id="lag-${data.driverId}">0</span>ms</div>
                `;
                grid.appendChild(card);
            }

            // Update content
            const llEl = document.getElementById(`ll-${data.driverId}`);
            if (llEl && data.lat && data.lng) {
                 llEl.innerText = `${data.lat.toFixed(4)}, ${data.lng.toFixed(4)}`;
            }
            
            // Calculate Logic Lag 
            if (data.timestamp) {
                const lag = Date.now() - data.timestamp;
                const lagEl = document.getElementById(`lag-${data.driverId}`);
                if (lagEl) {
                    lagEl.innerText = Math.max(0, lag);
                    // Color code lag
                    lagEl.style.color = lag < 200 ? '#4ade80' : (lag < 1000 ? '#facc15' : '#f87171');
                }
            }

            // Flash effect
            card.classList.remove('active');
            void card.offsetWidth; // trigger reflow
            card.classList.add('active');
        }
    </script>
</body>
</html>
