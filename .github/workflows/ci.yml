name: CI — Build & Test

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: 🧪 Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logistics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/logistics_test?schema=public
      REDIS_ENABLED: "true"
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-key-do-not-use-in-production
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: http://localhost:5173
      PORT: 3010

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20 (backend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ── Backend ──────────────────────────────────────────────
      - name: 📦 Install backend dependencies
        run: npm ci

      - name: 🔄 Generate Prisma Client
        run: npx prisma generate

      - name: 🔎 Type-check backend (TypeScript)
        run: npx tsc --noEmit

      - name: 🗄️ Run database migrations
        run: npx prisma migrate deploy

      - name: 🧪 Run backend tests
        run: npm run test -- --runInBand --detectOpenHandles

      - name: 🏗️ Build backend (TypeScript)
        run: npm run build

      # ── Frontend ─────────────────────────────────────────────
      - name: ⚙️ Setup Node.js 20 (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: 🔍 Lint frontend
        run: npm run lint
        working-directory: ./frontend

      - name: 🏗️ Build frontend
        run: npm run build
        working-directory: ./frontend
